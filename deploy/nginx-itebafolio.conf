server {
    listen 80;
    listen [::]:80;
    server_name itebafolio.locavps.my.id;

    root /var/www/itebafolio/frontend/dist;
    index index.html;

    client_max_body_size 4G;

    # Backend API (Express/PM2 di port 3000)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File upload (avatar, cover project, dll)
    # ^~ WAJIB: tanpa ini, location regex .jpg/.png di bawah akan menang
    # dan nginx coba serve file dari frontend/dist bukan proxy ke backend.
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static asset cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
    }

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
